<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wetzicht Kantoor: wetswijzigingen per klant</title>
<meta name="description" content="Zie per klant welke wetswijzigingen gelden, maak per klant een brief en krijg een signaal als er iets verschuift.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F1B17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230C5A45'/%3E%3Cpath d='M8 10h16M8 22h13' stroke='%23fff' stroke-opacity='.45' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M8 16h9' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='22.5' cy='16' r='2.6' fill='%23F4B740'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="wz.css">
<style>
  .tab { padding: .55rem .9rem; border-radius: .6rem; font-weight: 600; font-size: .92rem; color: var(--mute); cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--ink); background: rgba(15, 27, 23, .05); }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
  .mx { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .9rem; }
  .mx th, .mx td { border-bottom: 1px solid var(--line); }
  .mx thead th { position: sticky; top: 0; background: var(--card); z-index: 2; vertical-align: bottom; }
  .mx .first { position: sticky; left: 0; background: var(--card); z-index: 1; min-width: 13rem; max-width: 24rem; text-align: left; padding-left: 1rem; }
  @media (min-width: 720px) { .mx .first { min-width: 17rem; } }
  .mx thead .first { z-index: 3; }
  .mx .vname { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; max-height: 11.5rem; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: .78rem; padding: .4rem 0; }
  .mx tbody tr.row { cursor: pointer; }
  .mx tbody tr.row:hover td { background: #FAFBF8; }
  .mx tbody tr.row:hover .first { background: #FAFBF8; }
  .mx td.c { text-align: center; width: 2.4rem; min-width: 2.4rem; }
  dialog::backdrop { background: rgba(15, 27, 23, .45); }
  dialog { border: 0; border-radius: 1rem; padding: 0; width: min(46rem, calc(100vw - 1.5rem)); max-height: calc(100vh - 2rem); }
  textarea.letter { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.55; min-height: 26rem; white-space: pre-wrap; }
  @media print { .screen { display: none !important; } #printable { display: block !important; white-space: pre-wrap; font-size: 11pt; line-height: 1.5; } }
</style>
</head>
<body class="font-sans">

<header class="border-b border-line bg-ink text-white screen">
  <div class="mx-auto max-w-page px-4 sm:px-6 h-14 flex items-center justify-between gap-3">
    <a href="index.html" class="flex items-center gap-2.5" aria-label="Wetzicht, naar de startpagina">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0C5A45"/><path d="M8 10h16M8 22h13" stroke="#fff" stroke-opacity=".45" stroke-width="2.4" stroke-linecap="round"/><path d="M8 16h9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="22.5" cy="16" r="2.6" fill="#F4B740"/></svg>
      <span class="font-serif text-lg font-bold">Wetzicht <span class="font-sans font-medium text-white/60 text-sm">Kantoor</span></span>
    </a>
    <span class="hidden sm:inline text-xs text-white/60 truncate" id="lic-badge">Proefversie. Alles blijft in deze browser.</span>
  </div>
</header>

<div class="border-b border-line bg-white screen">
  <div class="mx-auto max-w-page px-4 sm:px-6 py-2 flex items-center gap-1 overflow-x-auto" role="tablist" aria-label="Onderdelen">
    <button class="tab" role="tab" data-tab="portefeuille" aria-selected="true">Portefeuille</button>
    <button class="tab" role="tab" data-tab="klanten" aria-selected="false">Klanten <span id="n-clients" class="opacity-60"></span></button>
    <button class="tab" role="tab" data-tab="signalen" aria-selected="false">Signalen <span id="n-signals" class="badge kind-p ml-1" hidden></span></button>
    <button class="tab" role="tab" data-tab="instellingen" aria-selected="false">Instellingen en export</button>
  </div>
</div>

<main class="mx-auto max-w-page px-4 sm:px-6 py-8 screen" id="app"></main>

<dialog id="dlg"><form method="dialog" id="dlg-form" novalidate class="flex flex-col max-h-[calc(100vh-2rem)]">
  <div class="px-5 sm:px-6 py-4 border-b border-line flex items-center justify-between gap-3">
    <h2 class="font-serif text-xl font-bold" id="dlg-title">Klant</h2>
    <button type="button" class="btn btn-quiet btn-sm" id="dlg-close" aria-label="Sluiten">Sluiten</button>
  </div>
  <div class="px-5 sm:px-6 py-5 overflow-y-auto">
    <div class="grid gap-4 sm:grid-cols-2 mb-6">
      <div><label class="label" for="c-name">Naam van de klant</label><input class="field" id="c-name" maxlength="80" autocomplete="off" required></div>
      <div><label class="label" for="c-contact">Aanhef in de brief (optioneel)</label><input class="field" id="c-contact" maxlength="60" autocomplete="off" placeholder="bijvoorbeeld mevrouw De Vries"></div>
    </div>
    <div class="mb-6 rounded-xl bg-paper p-4">
      <label class="label" for="c-code">Heeft de klant de check zelf gedaan? Plak dan de profielcode</label>
      <div class="flex gap-2"><input class="field" id="c-code" autocomplete="off" placeholder="WZ1.bv.10.bouw..." spellcheck="false"><button type="button" class="btn btn-ghost btn-sm" id="c-apply">Overnemen</button></div>
      <p class="text-xs text-mute mt-1.5" id="c-code-note">De antwoorden hieronder worden dan ingevuld.</p>
    </div>
    <div id="c-form"></div>
  </div>
  <div class="px-5 sm:px-6 py-4 border-t border-line">
    <p class="text-sm text-red mb-3 empty:hidden" id="dlg-error" role="alert"></p>
    <div class="flex justify-end gap-2"><button type="button" class="btn btn-ghost" id="dlg-cancel">Annuleren</button><button type="submit" class="btn btn-primary" id="dlg-save">Opslaan</button></div>
  </div>
</form></dialog>

<pre id="printable" hidden></pre>
<input type="file" id="restore-file" accept="application/json,.json" hidden>
<div id="toast" hidden role="status" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-50 rounded-full bg-ink text-white text-sm px-4 py-2 shadow-lg screen"></div>
<noscript><div style="padding:1rem;background:#FCEFD9;text-align:center">De kantoorversie heeft JavaScript nodig.</div></noscript>

<script src="data/changes.js"></script>
<script src="data/changelog.js"></script>
<script src="data/rules.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  // The page needs engine.js and the data folder next to it. A preview of this one file alone has neither: say so instead of breaking silently.
  if (!window.WZ || !window.WZ.DATA.items.length) {
    const n = document.createElement('div');
    n.setAttribute('role', 'alert');
    n.style.cssText = 'margin:2rem auto;max-width:40rem;background:#FCEFD9;color:#5B3206;padding:14px 18px;font:15px/1.45 system-ui,sans-serif;border:1px solid #E3C48F;border-radius:12px';
    n.textContent = 'Deze pagina kan de bijbehorende bestanden niet laden (engine.js en de map data). Open haar via een webserver of rechtstreeks vanuit de map. Een losse voorvertoning van alleen dit bestand werkt niet.';
    document.getElementById('app').appendChild(n);
    return;
  }
  const WZ = window.WZ, CFG = window.WZ_CONFIG || {};
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
  const esc = WZ.esc;
  const KEY = 'wetzicht.kantoor';
  const items = WZ.DATA.items;
  const GEN = (WZ.DATA.generated || '').slice(0, 10);

  /* ---------- state ---------- */
  const fresh = () => ({ firm: '', form: 'u', clients: [], seen: null, seenAt: '', license: '' });
  let S = fresh();
  const ui = { tab: 'portefeuille', client: null, filter: 'alles', maybe: false, open: null, letter: { plan: true, now: true, maybe: false, text: true }, example: false };
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (raw && Array.isArray(raw.clients)) S = Object.assign(fresh(), raw, { clients: raw.clients.map(cleanClient).filter(Boolean) });
    } catch (e) { S = fresh(); }
    if (!S.seen) markSeen();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Opslaan in de browser lukte niet. Download een back-up.'); } }
  function cleanClient(c) {
    if (!c || typeof c.name !== 'string' || !c.name.trim()) return null;
    return { id: String(c.id || uid()), name: c.name.trim().slice(0, 80), contact: String(c.contact || '').trim().slice(0, 60), profile: WZ.cleanProfile(c.profile) };
  }
  const uid = () => 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  let toastTimer;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800); }

  /* ---------- licence: a signed code lifts the client limit ----------
     A code is "WZ-" + payload + "." + signature. The payload says who it is for, which plan and until when.
     The app checks the signature with the public keys in config.js. It can verify a code but never make one. */
  const PLAN = { seizoen: 'Seizoenspas', kantoor: 'Kantoor', plus: 'Kantoor Plus' };
  const LIC_ERR = {
    vorm: 'Dit is geen licentiecode. Een code begint met WZ- en is ruim 200 tekens lang. Plak hem in zijn geheel.',
    handtekening: 'Deze code is niet geldig. Controleer of je de hele code hebt geplakt.',
    ingetrokken: 'Deze code is ingetrokken en werkt niet meer.',
    browser: 'Deze browser kan de code hier niet controleren. Open de kantoorversie op https://wetzicht.nl/kantoor.html en probeer het daar.',
  };
  let LIC = { state: 'none' };   // 'none' = trial, 'ok', or 'expired'
  const limit = () => (LIC.state === 'ok' ? LIC.max : (CFG.freeClients || 0));   // 0 = no limit
  const b64u = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
  /* Returns { state: 'ok' | 'expired', code, name, plan, until, max, id } or { state: 'bad', why }. */
  async function readLicense(code) {
    const clean = String(code || '').replace(/\s+/g, '');
    const m = clean.match(/^WZ-([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/);
    if (!m) return { state: 'bad', why: 'vorm' };
    if (!window.crypto || !window.crypto.subtle) return { state: 'bad', why: 'browser' };
    let bytes, signature, d;
    try { bytes = b64u(m[1]); signature = b64u(m[2]); d = JSON.parse(new TextDecoder().decode(bytes)); } catch (e) { return { state: 'bad', why: 'vorm' }; }
    let signed = false;
    for (const jwk of CFG.licenseKeys || []) {
      try {
        const key = await crypto.subtle.importKey('jwk', jwk, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
        if (await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, signature, bytes)) { signed = true; break; }
      } catch (e) { /* try the next key */ }
    }
    if (!signed) return { state: 'bad', why: 'handtekening' };
    if (!d || d.v !== 1 || typeof d.n !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d.e || '')) return { state: 'bad', why: 'vorm' };
    if ((CFG.revoked || []).includes(d.id)) return { state: 'bad', why: 'ingetrokken' };
    return {
      state: d.e >= WZ.todayIso() ? 'ok' : 'expired',
      code: clean, name: d.n.slice(0, 60), plan: PLAN[d.p] || 'Licentie', until: d.e,
      max: Number.isInteger(d.m) && d.m > 0 ? d.m : 0, id: String(d.id || ''),
    };
  }
  /* At start: check the stored code again, because it may have expired or been withdrawn since last time. */
  async function restoreLicense() {
    if (!S.license) return;
    const r = await readLicense(S.license);
    LIC = r.state === 'bad' ? { state: 'none', rejected: r.why } : r;
    render();
  }
  /* A link like kantoor.html#licentie=WZ-... activates the code in one click. */
  async function licenseFromLink() {
    const code = new URLSearchParams(location.hash.replace(/^#/, '')).get('licentie');
    if (!code) return;
    history.replaceState(null, '', location.pathname + location.search);   // keep the code out of the address bar
    const r = await readLicense(code);
    ui.tab = 'instellingen'; ui.client = null;
    if (r.state === 'ok') { S.license = r.code; LIC = r; save(); render(); toast(`Licentie geactiveerd voor ${r.name}.`); return; }
    render();
    const err = $('#lic-error');
    if (err) err.textContent = r.state === 'expired' ? `Deze code is op ${WZ.fmtDate(r.until)} verlopen.` : LIC_ERR[r.why];
  }

  /* ---------- matching, cached per render ---------- */
  let M = new Map();   // clientId -> Map(itemId -> row)
  function recompute() { M = new Map(S.clients.map((c) => [c.id, new Map(WZ.evaluate(c.profile).map((r) => [r.item.id, r]))])); }
  const rowFor = (c, id) => M.get(c.id).get(id);
  const hitsOf = (id, cls) => S.clients.filter((c) => rowFor(c, id).cls === cls);
  const phasePass = (it) => ui.filter === 'alles' || it.ph === ui.filter || (ui.filter === 'plan' && it.ph === 'onbekend');

  /* ---------- signals: what changed in the list since the last visit ---------- */
  const sig = (it) => [it.d || it.dn || '', it.ph, it.mod || ''].join('|');
  // The title is kept too, so a change that leaves the list can still be named.
  function markSeen() { S.seen = Object.fromEntries(items.map((it) => [it.id, { s: sig(it), t: it.t }])); S.seenAt = WZ.todayIso(); save(); }
  function signals() {
    const out = [];
    const seen = S.seen || {};
    const sigOf = (v) => (v && typeof v === 'object' ? v.s : v);
    for (const it of items) {
      const old = sigOf(seen[it.id]);
      if (old === undefined) { out.push({ type: 'nieuw', it }); continue; }
      if (old === sig(it)) continue;
      const [od, oph] = old.split('|');
      if (od !== (it.d || it.dn || '')) out.push({ type: 'datum', it, from: od, to: it.d || it.dn || '' });
      else if (oph !== it.ph) out.push({ type: 'status', it, from: oph, to: it.ph });
      else out.push({ type: 'tekst', it });
    }
    for (const id of Object.keys(seen)) {
      if (!items.some((it) => it.id === id)) out.push({ type: 'vervallen', id, t: (seen[id] && seen[id].t) || id.replace(/-/g, ' ') });
    }
    return out;
  }
  const SIGNAL = { nieuw: 'Nieuw op de lijst', datum: 'Datum verschoven', status: 'Status veranderd', tekst: 'Tekst aangepast', vervallen: 'Van de lijst gehaald' };

  /* ---------- navigation ---------- */
  function go(tab, extra) { ui.tab = tab; ui.client = (extra && extra.client) || null; ui.open = null; render(); window.scrollTo(0, 0); }
  function render() {
    recompute();
    $$('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab)));
    $('#n-clients').textContent = S.clients.length ? '(' + S.clients.length + ')' : '';
    $('#lic-badge').textContent = (LIC.state === 'ok' ? `Licentie: ${LIC.name}.` : 'Proefversie.') + ' Alles blijft in deze browser.';
    const ns = signals().length; const badge = $('#n-signals'); badge.hidden = !ns; badge.textContent = ns;
    const app = $('#app');
    if (ui.tab === 'portefeuille') app.innerHTML = viewPortfolio();
    else if (ui.tab === 'klanten') app.innerHTML = ui.client && S.clients.some((c) => c.id === ui.client) ? viewClient(S.clients.find((c) => c.id === ui.client)) : viewClients();
    else if (ui.tab === 'signalen') app.innerHTML = viewSignals();
    else app.innerHTML = viewSettings();
  }

  /* ---------- empty state ---------- */
  function emptyState() {
    return `<div class="card p-8 sm:p-12 text-center max-w-2xl mx-auto">
      <p class="eyebrow">Begin hier</p>
      <h1 class="font-serif text-3xl font-bold mt-2">Zet je eerste klanten erin</h1>
      <p class="mt-3 text-mute">Per klant vul je in twee minuten in hoe het bedrijf eruitziet. Daarna zie je voor je hele portefeuille welke van de ${items.length} wetswijzigingen wie raken.</p>
      <div class="mt-6 flex flex-wrap justify-center gap-3">
        <button class="btn btn-primary" data-act="demo">Laad acht voorbeeldklanten</button>
        <button class="btn btn-ghost" data-act="new">Nieuwe klant</button>
      </div>
      <p class="mt-4 text-xs text-mute">De voorbeeldklanten zijn verzonnen. Je kunt ze met één klik weer weghalen.</p>
    </div>`;
  }

  /* ---------- portfolio ---------- */
  function filterBar() {
    const b = (k, n) => `<button class="btn btn-sm ${ui.filter === k ? 'btn-ink' : 'btn-ghost'}" data-act="filter" data-v="${k}" aria-pressed="${ui.filter === k}">${n}</button>`;
    return `<div class="flex flex-wrap items-center gap-2">${b('alles', 'Alles')}${b('vast', 'Staat vast')}${b('ingegaan', 'Geldt al')}${b('plan', 'Plannen')}
      <label class="ml-1 flex items-center gap-2 text-sm text-mute cursor-pointer"><input type="checkbox" data-act="maybe" ${ui.maybe ? 'checked' : ''} class="accent-[#0C5A45] w-4 h-4"> ook mogelijk relevant</label></div>`;
  }
  function viewPortfolio() {
    if (!S.clients.length) return emptyState();
    const today = WZ.todayIso();
    // Coming up first, then without a date, then what is already in force.
    const order = (it) => (it.d && it.d >= today ? 0 : !it.d ? 1 : 2);
    const rows = items.map((it) => ({ it, hit: hitsOf(it.id, 'raakt'), maybe: hitsOf(it.id, 'mogelijk') }))
      .filter((r) => phasePass(r.it) && (r.hit.length || (ui.maybe && r.maybe.length)))
      .sort((a, b) => order(a.it) - order(b.it) || (a.it.d || '').localeCompare(b.it.d || '') || b.hit.length - a.hit.length);
    const touching = items.filter((it) => hitsOf(it.id, 'raakt').length).length;
    const next = items.filter((it) => it.ph === 'vast' && it.d && it.d >= today && hitsOf(it.id, 'raakt').length)[0];
    // The raster needs room: on a narrow screen, or with many clients, show counts and open a row for the names.
    const narrow = window.innerWidth < 720;
    const grid = S.clients.length <= 14 && !narrow;
    const head = `<tr><th class="first py-2 pr-3 text-xs font-bold uppercase tracking-wider text-mute">Wijziging</th><th class="px-2 pb-2 text-xs font-bold uppercase tracking-wider text-mute text-right whitespace-nowrap">Raakt</th>${grid ? S.clients.map((c) => `<th class="px-1"><button class="vname hover:text-brand" data-act="client" data-id="${esc(c.id)}" title="${esc(c.name)}">${esc(c.name)}</button></th>`).join('') : ''}</tr>`;
    const body = rows.map(({ it, hit, maybe }) => {
      const open = ui.open === it.id;
      const cells = grid ? S.clients.map((c) => { const cls = rowFor(c, it.id).cls; return `<td class="c">${cls === 'raakt' ? '<span class="dot dot-raakt" title="raakt"></span>' : cls === 'mogelijk' && ui.maybe ? '<span class="dot dot-mogelijk" title="mogelijk"></span>' : ''}</td>`; }).join('') : '';
      const main = `<tr class="row" data-act="open" data-id="${esc(it.id)}" aria-expanded="${open}">
        <td class="first py-2.5 pr-3"><span class="flex flex-wrap items-center gap-1.5 mb-1"><span class="text-xs font-bold ${it.d ? 'text-amber' : 'text-mute'}">${esc(WZ.dateLabel(it))}</span><span class="badge ph-${esc(it.ph)}">${esc(WZ.PHASE[it.ph].n)}</span></span><span class="font-semibold leading-snug">${esc(it.t)}</span></td>
        <td class="px-2 text-right whitespace-nowrap"><span class="font-serif text-lg font-bold">${hit.length}</span>${ui.maybe && maybe.length ? `<span class="text-xs text-mute"> +${maybe.length}</span>` : ''}</td>${cells}</tr>`;
      if (!open) return main;
      const who = (list, cls) => list.map((c) => `<li class="flex flex-wrap items-baseline gap-x-2"><button class="font-semibold hover:underline underline-offset-2 text-left" data-act="client" data-id="${esc(c.id)}">${esc(c.name)}</button><span class="text-mute text-sm">${esc(WZ.reason(rowFor(c, it.id), 'k').replace(/^[A-Z]/, (ch) => ch.toLowerCase()))}</span></li>`).join('');
      const detail = `<tr><td colspan="${2 + (grid ? S.clients.length : 0)}" class="bg-paper p-4 sm:p-5">
        <div class="grid gap-6 lg:grid-cols-2">
          <div><h3 class="text-xs font-bold uppercase tracking-wider text-mute">Raakt ${hit.length} ${hit.length === 1 ? 'klant' : 'klanten'}</h3>
            <ul class="mt-2 space-y-1.5">${who(hit) || '<li class="text-mute text-sm">Geen.</li>'}</ul>
            ${maybe.length ? `<h3 class="text-xs font-bold uppercase tracking-wider text-mute mt-4">Mogelijk bij ${maybe.length}</h3><ul class="mt-2 space-y-1.5">${who(maybe)}</ul>` : ''}
            <button class="btn btn-ghost btn-sm mt-4" data-act="copy-names" data-id="${esc(it.id)}">Kopieer de namen</button></div>
          <div>${WZ.card({ item: it, cls: 'raakt', conds: [], kind: (WZ.RULES[it.id] || {}).k || 'r' }, { form: 'u', open: true })}</div>
        </div></td></tr>`;
      return main + detail;
    }).join('');
    return `<div class="flex flex-wrap items-end justify-between gap-4">
        <div><p class="eyebrow">Portefeuille</p><h1 class="font-serif text-3xl sm:text-4xl font-bold tracking-tight mt-1">${touching} van de ${items.length} wijzigingen ${touching === 1 ? 'raakt' : 'raken'} je klanten</h1></div>
        <button class="btn btn-ghost btn-sm" data-act="csv">Exporteer naar Excel (csv)</button>
      </div>
      <div class="mt-5 grid gap-3 sm:grid-cols-3">
        <div class="card p-4"><div class="text-xs text-mute">Klanten</div><div class="font-serif text-3xl font-bold">${S.clients.length}</div></div>
        <div class="card p-4"><div class="text-xs text-mute">Eerstvolgende vaste datum</div><div class="font-serif text-xl font-bold mt-1">${next ? esc(WZ.fmtDate(next.d)) : 'geen'}</div>${next ? `<div class="text-sm text-mute leading-snug mt-0.5">${esc(next.t)}</div>` : ''}</div>
        <div class="card p-4"><div class="text-xs text-mute">Lijst opgehaald op</div><div class="font-serif text-xl font-bold mt-1">${esc(WZ.fmtDate(GEN))}</div><div class="text-sm text-mute mt-0.5">Bron: Ondernemersplein</div></div>
      </div>
      ${WZ.staleNote() ? `<p class="mt-3 rounded-xl bg-[#FCEFD9] text-amber px-4 py-3 text-sm">${esc(WZ.staleNote())}</p>` : ''}
      <div class="mt-6">${filterBar()}</div>
      <div class="card mt-4 overflow-auto max-h-[75vh]"><table class="mx"><thead>${head}</thead><tbody>${body || `<tr><td class="p-6 text-mute" colspan="99">Niets in deze selectie.</td></tr>`}</tbody></table></div>
      <p class="mt-3 text-sm text-mute">Klik op een wijziging voor de geraakte klanten en de tekst van de overheid. Klik op een klantnaam voor de lijst en de brief van die klant.${grid ? '' : narrow ? ' Op een smal scherm zie je aantallen in plaats van het raster.' : ' Bij meer dan veertien klanten zie je aantallen in plaats van het raster.'}</p>`;
  }

  /* ---------- clients ---------- */
  function clientStats(c) {
    const rows = [...M.get(c.id).values()];
    const s = WZ.summarize(rows);
    const today = WZ.todayIso();
    const next = rows.filter((r) => r.cls === 'raakt' && r.item.ph === 'vast' && r.item.d && r.item.d >= today).sort(WZ.sortItems)[0];
    return { s, next };
  }
  function viewClients() {
    if (!S.clients.length) return emptyState();
    const lim = limit();
    const full = lim && S.clients.length >= lim;
    // Why no more clients can be added, and what to do about it. Existing clients always stay usable.
    const fullNote = !full ? '' : LIC.state === 'ok'
      ? `Je licentie geldt voor ${lim} klanten. Voor meer klanten heb je een andere licentie nodig.`
      : LIC.state === 'expired'
        ? `Je licentie is op ${esc(WZ.fmtDate(LIC.until))} verlopen. Je klanten blijven staan en je kunt alles blijven bekijken, brieven maken en exporteren. Nieuwe klanten toevoegen kan weer met een nieuwe code. <button class="underline underline-offset-2 font-semibold" data-act="go-license">Code invoeren</button>`
        : `De proefversie houdt ${lim} klanten vast. Met een licentiecode vervalt die grens. <button class="underline underline-offset-2 font-semibold" data-act="go-license">Code invoeren</button>`;
    const list = [...S.clients].sort((a, b) => a.name.localeCompare(b.name, 'nl')).map((c) => {
      const { s, next } = clientStats(c);
      return `<li class="card p-4 sm:p-5 flex flex-wrap items-center justify-between gap-4">
        <div class="min-w-0"><button class="font-serif text-xl font-bold text-left hover:underline underline-offset-4" data-act="client" data-id="${esc(c.id)}">${esc(c.name)}</button>
          <p class="text-sm text-mute mt-0.5">${esc(WZ.profileLabel(c.profile))}</p>
          ${next ? `<p class="text-sm mt-1"><span class="font-semibold text-amber">${esc(WZ.fmtDate(next.item.d))}</span> <span class="text-mute">${esc(next.item.t)}</span></p>` : ''}</div>
        <div class="flex items-center gap-4"><div class="text-right"><div class="font-serif text-3xl font-bold text-brand leading-none">${s.raakt}</div><div class="text-xs text-mute">${s.raakt === 1 ? 'raakt' : 'raken'} · ${s.mogelijk + s.algemeen} mogelijk</div></div>
          <div class="flex gap-1"><button class="btn btn-ghost btn-sm" data-act="client" data-id="${esc(c.id)}">Bekijk</button><button class="btn btn-quiet btn-sm" data-act="edit" data-id="${esc(c.id)}">Bewerk</button></div></div></li>`;
    }).join('');
    return `<div class="flex flex-wrap items-end justify-between gap-4">
        <div><p class="eyebrow">Klanten</p><h1 class="font-serif text-3xl sm:text-4xl font-bold tracking-tight mt-1">${S.clients.length} ${S.clients.length === 1 ? 'klant' : 'klanten'}</h1></div>
        <div class="flex flex-wrap gap-2"><button class="btn btn-primary" data-act="new" ${full ? 'disabled' : ''}>Nieuwe klant</button></div>
      </div>
      ${full ? `<p class="mt-4 rounded-xl bg-[#FCEFD9] text-amber px-4 py-3 text-sm">${fullNote}</p>` : ''}
      <div class="card p-4 sm:p-5 mt-5 bg-brand-soft border-brand/20">
        <h2 class="font-semibold">Laat klanten het zelf invullen</h2>
        <p class="text-sm text-mute mt-1">Stuur deze link. De klant doet de check en stuurt je een profielcode terug. Die plak je bij "Nieuwe klant". In de link staat alleen je kantoornaam.</p>
        <div class="mt-3 flex flex-wrap items-center gap-2"><code class="block max-w-full overflow-x-auto rounded-lg bg-white border border-line px-3 py-2 text-sm" id="intake">${esc(intakeLink())}</code><button class="btn btn-ink btn-sm" data-act="copy-intake">Kopieer link</button></div>
        ${S.firm ? '' : '<p class="text-xs text-mute mt-2">Vul bij Instellingen je kantoornaam in, dan staat die bovenaan de check.</p>'}
      </div>
      <ul class="mt-5 grid gap-3">${list}</ul>`;
  }
  function intakeLink() {
    // On a web server the check lives at the folder root; opened straight from disk it is index.html.
    const base = new URL(location.protocol === 'file:' ? 'index.html' : './', location.href.split(/[?#]/)[0]).href;
    return base + (S.firm ? '#k=' + encodeURIComponent(S.firm) : '');
  }

  /* ---------- one client: list and letter ---------- */
  function viewClient(c) {
    const rows = [...M.get(c.id).values()];
    const s = WZ.summarize(rows);
    const hit = rows.filter((r) => r.cls === 'raakt').sort(WZ.sortItems);
    const maybe = rows.filter((r) => r.cls === 'mogelijk' || r.cls === 'algemeen').sort(WZ.sortItems);
    const groups = [['vast', 'Staat vast'], ['ingegaan', 'Geldt al'], ['plan', 'Plannen, nog niet zeker']];
    const lists = groups.map(([ph, t]) => {
      const l = hit.filter((r) => r.item.ph === ph || (ph === 'plan' && r.item.ph === 'onbekend'));
      return l.length ? `<h3 class="font-serif text-xl font-bold mt-6 mb-3">${t} <span class="text-sm font-sans text-mute">${l.length}</span></h3><div class="grid gap-3">${l.map((r) => WZ.card(r, { form: 'u' })).join('')}</div>` : '';
    }).join('');
    const o = ui.letter;
    const opt = (k, n) => `<label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" data-act="letter-opt" data-k="${k}" ${o[k] ? 'checked' : ''} class="accent-[#0C5A45] w-4 h-4">${n}</label>`;
    return `<button class="btn btn-quiet btn-sm -ml-2" data-act="back">← Alle klanten</button>
      <div class="mt-2 flex flex-wrap items-end justify-between gap-4">
        <div><h1 class="font-serif text-3xl sm:text-4xl font-bold tracking-tight">${esc(c.name)}</h1><p class="text-mute mt-1">${esc(WZ.profileLabel(c.profile))}</p></div>
        <div class="flex gap-2"><button class="btn btn-ghost btn-sm" data-act="edit" data-id="${esc(c.id)}">Bewerk profiel</button><button class="btn btn-quiet btn-sm" data-act="del" data-id="${esc(c.id)}">Verwijder</button></div>
      </div>
      <div class="mt-6 grid gap-8 lg:grid-cols-2 lg:items-start">
        <section aria-label="Lijst">
          <div class="card p-4 flex items-center gap-5"><div class="font-serif text-5xl font-bold text-brand leading-none">${s.raakt}</div><div class="text-sm text-mute">van de ${s.total} wijzigingen ${s.raakt === 1 ? 'raakt' : 'raken'} deze klant.<br>${s.mogelijk + s.algemeen} ${s.mogelijk + s.algemeen === 1 ? 'is' : 'zijn'} mogelijk relevant.</div></div>
          ${lists || '<p class="card p-5 mt-4 text-mute">Met dit profiel raakt geen wijziging deze klant. Controleer of het profiel compleet is.</p>'}
          ${maybe.length ? `<details class="mt-6"><summary class="cursor-pointer font-serif text-xl font-bold">Mogelijk relevant <span class="text-sm font-sans text-mute">${maybe.length}</span></summary><div class="grid gap-3 mt-3">${maybe.map((r) => WZ.card(r, { form: 'u' })).join('')}</div></details>` : ''}
        </section>
        <section aria-label="Brief" class="lg:sticky lg:top-4">
          <div class="card p-4 sm:p-5">
            <div class="flex flex-wrap items-center justify-between gap-3"><h2 class="font-serif text-xl font-bold">Brief voor deze klant</h2>
              <div class="flex gap-2"><button class="btn btn-primary btn-sm" data-act="copy-letter">Kopieer</button><button class="btn btn-ghost btn-sm" data-act="print-letter">Print</button></div></div>
            <div class="mt-3 flex flex-wrap gap-x-5 gap-y-2">${opt('now', 'wat al geldt')}${opt('plan', 'plannen')}${opt('maybe', 'mogelijk relevant')}${opt('text', 'korte toelichting van de overheid')}</div>
            <textarea class="field letter mt-3" id="letter" spellcheck="false" aria-label="Brieftekst">${esc(letter(c))}</textarea>
            <p class="text-xs text-mute mt-2">Lees de brief na voor je hem verstuurt. Jij kent de klant, deze lijst kent alleen het profiel.</p>
          </div>
        </section>
      </div>`;
  }
  function excerpt(it) {
    const first = (it.wat[0] || '').replace(/\s*\n\s*/g, ' ').trim();
    if (!first) return '';
    if (first.length <= 420) return first;
    const cut = first.slice(0, 420);
    const end = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('? '));
    return end > 120 ? cut.slice(0, end + 1) : cut.replace(/\s+\S*$/, '') + ' …';
  }
  function letter(c) {
    const u = S.form !== 'je';
    const o = ui.letter;
    const rows = [...M.get(c.id).values()];
    const hit = rows.filter((r) => r.cls === 'raakt').sort(WZ.sortItems);
    const part = (ph) => hit.filter((r) => r.item.ph === ph || (ph === 'plan' && r.item.ph === 'onbekend'));
    const blocks = [['STAAT VAST', part('vast')]];
    if (o.now) blocks.push(['GELDT AL', part('ingegaan')]);
    if (o.plan) blocks.push(['PLANNEN, NOG NIET ZEKER', part('plan')]);
    if (o.maybe) blocks.push(['MOGELIJK RELEVANT', rows.filter((r) => r.cls === 'mogelijk').sort(WZ.sortItems)]);
    const shown = blocks.reduce((n, b) => n + b[1].length, 0);
    const J = u ? 'u' : 'je', JW = u ? 'uw' : 'je';
    let n = 0;
    const body = blocks.filter((b) => b[1].length).map(([title, list]) => title + '\n\n' + list.map((r) => {
      n++;
      const lines = [`${n}. ${r.item.t}`, `   Ingangsdatum: ${WZ.dateLabel(r.item)}`, `   ${WZ.reason(r, u ? 'u' : 'je')}`];
      const ex = o.text ? excerpt(r.item) : '';
      if (ex) lines.push(`   Volgens de overheid: "${ex}"`);
      lines.push(`   Meer lezen: ${r.item.url}`);
      return lines.join('\n');
    }).join('\n\n')).join('\n\n\n');
    const greet = c.contact ? `Beste ${c.contact},` : (u ? 'Geachte relatie,' : 'Beste relatie,');
    const firm = S.firm || '[naam kantoor]';
    return `Onderwerp: Wat er voor ${c.name} verandert

${greet}

De overheid houdt een lijst bij met alle wetswijzigingen voor ondernemers. Daar staan op dit moment ${items.length} wijzigingen op. Wij hebben die lijst naast ${JW} bedrijf gelegd. ${shown === 0 ? 'Op dit moment zien wij geen wijzigingen die ' + c.name + ' raken.' : (shown === 1 ? 'Eén wijziging is' : shown + ' wijzigingen zijn') + ' voor ' + c.name + ' van belang. Die ' + (shown === 1 ? 'staat' : 'staan') + ' hieronder, met de reden erbij.'}

${body}

${shown === 0 ? '' : `Wil${u ? 't u' : ' je'} weten wat dit voor ${c.name} betekent, of wat ${J} nu al kun${u ? 't' : 't'} regelen? Laat het ons weten, dan plannen we een gesprek.\n\n`}Met vriendelijke groet,

${firm}

Dit overzicht is gebaseerd op de officiële lijst van Ondernemersplein (KVK en Rijksoverheid), opgehaald op ${WZ.fmtDate(GEN)}. Het is een signalering en geen juridisch advies. Plannen kunnen nog veranderen.`.replace(/\n{4,}/g, '\n\n\n');
  }

  /* ---------- signals ---------- */
  function viewSignals() {
    let list = signals();
    let example = false;
    if (!list.length && ui.example) {
      example = true;
      list = items.filter((it) => it.ph === 'vast' && it.d && it.d >= WZ.todayIso()).slice(0, 2).map((it, i) => (i === 0 ? { type: 'nieuw', it } : { type: 'datum', it, from: 'nog niet bekend', to: it.d }));
    }
    const fmt = (v) => (/^\d{4}-\d{2}-\d{2}$/.test(v) ? WZ.fmtDate(v) : (WZ.PHASE[v] ? WZ.PHASE[v].n.toLowerCase() : v || 'onbekend'));
    const cards = list.map((sg) => {
      if (sg.type === 'vervallen') return `<li class="card p-4 sm:p-5"><span class="badge ph-onbekend">${SIGNAL.vervallen}</span><h3 class="font-semibold text-lg mt-2 leading-snug">${esc(sg.t)}</h3><p class="text-sm text-mute mt-1">Deze wijziging staat niet meer op de officiële lijst. Dat kan betekenen dat hij is ingetrokken, of al zo lang geldt dat de overheid hem heeft weggehaald.</p></li>`;
      const hit = S.clients.length ? hitsOf(sg.it.id, 'raakt') : [];
      return `<li class="card p-4 sm:p-5"><div class="flex flex-wrap items-center gap-2"><span class="badge kind-p">${SIGNAL[sg.type]}</span><span class="badge ph-${esc(sg.it.ph)}">${esc(WZ.PHASE[sg.it.ph].n)}</span><span class="text-xs font-bold text-amber">${esc(WZ.dateLabel(sg.it))}</span></div>
        <h3 class="font-semibold text-lg mt-2 leading-snug">${esc(sg.it.t)}</h3>
        ${sg.from !== undefined ? `<p class="text-sm text-mute mt-1">Was: ${esc(fmt(sg.from))}. Is nu: ${esc(fmt(sg.to))}.</p>` : ''}
        <p class="text-sm mt-2">${S.clients.length ? (hit.length ? `Raakt ${hit.length} ${hit.length === 1 ? 'klant' : 'klanten'}: ${hit.map((c) => `<button class="font-semibold hover:underline underline-offset-2" data-act="client" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join(', ')}.` : 'Raakt geen van je klanten.') : 'Zet klanten in je portefeuille om te zien wie dit raakt.'}</p>
        <a class="text-sm text-brand underline underline-offset-2 mt-2 inline-block" href="${esc(WZ.safeUrl(sg.it.url))}" target="_blank" rel="noopener">Lees op Ondernemersplein</a></li>`;
    }).join('');
    const log = (WZ.LOG || []).slice(0, 30).map((l) => `<li class="flex gap-3 text-sm"><span class="flex-none w-24 text-mute">${esc(WZ.fmtDate(l.at))}</span><span><strong>${esc(SIGNAL[l.type] || l.type)}:</strong> ${esc(l.t || l.id)}${l.from !== undefined ? ` <span class="text-mute">(${esc(fmt(l.from))} → ${esc(fmt(l.to))})</span>` : ''}</span></li>`).join('');
    return `<div class="flex flex-wrap items-end justify-between gap-4">
        <div><p class="eyebrow">Signalen</p><h1 class="font-serif text-3xl sm:text-4xl font-bold tracking-tight mt-1">${example ? 'Zo ziet een signaal eruit' : list.length ? `${list.length} ${list.length === 1 ? 'verandering' : 'veranderingen'} sinds ${esc(WZ.fmtDate(S.seenAt))}` : 'Niets veranderd'}</h1></div>
        ${list.length && !example ? '<button class="btn btn-primary" data-act="seen">Markeer als gezien</button>' : ''}
      </div>
      ${example ? '<p class="mt-3 rounded-xl bg-[#FCEFD9] text-amber px-4 py-3 text-sm">Dit is een voorbeeld met twee echte wijzigingen uit de lijst. Er is nu niets veranderd. <button class="underline underline-offset-2 font-semibold" data-act="example-off">Voorbeeld sluiten</button></p>' : ''}
      ${list.length ? `<ul class="mt-5 grid gap-3">${cards}</ul>` : `<div class="card p-6 sm:p-8 mt-5"><p class="text-mute">Sinds ${esc(WZ.fmtDate(S.seenAt))} is er op de officiële lijst niets bijgekomen, verschoven of van status veranderd. Zodra dat gebeurt, zie je hier welke wijziging het is en welke klanten het raakt.</p><button class="btn btn-ghost btn-sm mt-4" data-act="example-on">Laat een voorbeeld zien</button></div>`}
      <h2 class="font-serif text-xl font-bold mt-10">Logboek van de bron</h2>
      <p class="text-sm text-mute mt-1">Wat er tussen twee keer ophalen op de officiële lijst veranderde.</p>
      ${log ? `<ul class="card p-4 sm:p-5 mt-3 space-y-2">${log}</ul>` : '<p class="card p-4 sm:p-5 mt-3 text-sm text-mute">Nog leeg. Het logboek vult zich vanaf de tweede keer dat de lijst wordt opgehaald.</p>'}
      <p class="text-xs text-mute mt-3">Je ziet signalen zodra je deze pagina opent.</p>`;
  }

  /* ---------- settings ---------- */
  function licenseCard() {
    const how = CFG.contactEmail
      ? `Nog geen code? Mail naar <a class="underline underline-offset-2" href="mailto:${esc(CFG.contactEmail)}?subject=${encodeURIComponent('Licentie Wetzicht Kantoor')}">${esc(CFG.contactEmail)}</a>.`
      : 'Licentiecodes zijn binnenkort te koop.';
    let status;
    if (LIC.state === 'ok') {
      status = `<p class="rounded-xl bg-brand-soft px-4 py-3 text-sm"><strong>${esc(LIC.plan)}</strong> op naam van <strong>${esc(LIC.name)}</strong>. Geldig tot en met ${esc(WZ.fmtDate(LIC.until))}, voor ${LIC.max ? LIC.max + ' klanten' : 'onbeperkt veel klanten'}.</p>`;
    } else if (LIC.state === 'expired') {
      status = `<p class="rounded-xl bg-[#FCEFD9] text-amber px-4 py-3 text-sm">De licentie van ${esc(LIC.name)} is op ${esc(WZ.fmtDate(LIC.until))} verlopen. Je klanten blijven staan en je kunt alles blijven bekijken, brieven maken en exporteren. Nieuwe klanten toevoegen kan weer met een nieuwe code.</p>`;
    } else {
      status = `<p class="text-sm text-mute">Je gebruikt de proefversie: maximaal ${CFG.freeClients || 0} klanten. Met een licentiecode vervalt die grens. ${how}</p>`
        + (LIC.rejected ? `<p class="mt-2 rounded-xl bg-[#FCEFD9] text-amber px-4 py-3 text-sm">${LIC.rejected === 'ingetrokken' ? 'De code die hier was opgeslagen is ingetrokken en werkt niet meer.' : LIC.rejected === 'browser' ? esc(LIC_ERR.browser) : 'De code die hier was opgeslagen is niet meer geldig.'}</p>` : '');
    }
    return `<div class="card p-5 sm:p-6 mt-5" id="licentie">
        <h2 class="font-semibold">Licentie</h2>
        <div class="mt-3">${status}</div>
        <label class="label mt-4" for="lic-code">${LIC.state === 'none' ? 'Licentiecode' : 'Andere licentiecode'}</label>
        <textarea class="field" id="lic-code" rows="3" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="WZ-..."></textarea>
        <p class="text-sm text-red mt-2 empty:hidden" id="lic-error" role="alert"></p>
        <div class="mt-3 flex flex-wrap gap-2"><button class="btn btn-primary btn-sm" data-act="lic-activate">Activeer</button>${S.license ? '<button class="btn btn-quiet btn-sm" data-act="lic-remove">Verwijder licentie</button>' : ''}</div>
      </div>`;
  }
  function viewSettings() {
    return `<p class="eyebrow">Instellingen en export</p><h1 class="font-serif text-3xl sm:text-4xl font-bold tracking-tight mt-1">Je kantoor</h1>
      <div class="mt-6 grid gap-5 lg:grid-cols-2">

          <label class="label mt-4" for="s-firm">Naam van je kantoor</label><input class="field" id="s-firm" maxlength="60" value="${esc(S.firm)}" autocomplete="organization" placeholder="Staat onder elke brief en boven de check voor je klanten">
          <fieldset class="mt-4"><legend class="label">Aanspreekvorm</legend><div class="grid grid-cols-2 gap-2">
            <label class="opt radio"><input type="radio" name="s-form" value="u" ${S.form !== 'je' ? 'checked' : ''}><span class="box"></span><span>U</span></label>

        <div class="card p-5 sm:p-6">
          <h2 class="font-semibold">Je gegevens</h2>

          <div class="mt-4 flex flex-wrap gap-2">
            <button class="btn btn-ink btn-sm" data-act="backup">Download back-up</button>
            <button class="btn btn-ghost btn-sm" data-act="restore">Zet back-up terug</button>
            <button class="btn btn-ghost btn-sm" data-act="csv">Exporteer naar Excel (csv)</button>
          </div>
          <div class="mt-5 pt-5 border-t border-line flex flex-wrap gap-2">
            <button class="btn btn-ghost btn-sm" data-act="demo">Laad voorbeeldklanten</button>
            <button class="btn btn-quiet btn-sm" data-act="wipe">Wis alles</button>

      </div>`;
  }

  /* ---------- demo data (made-up clients) ---------- */
  const DEMO = [
    ['Bouwbedrijf (voorbeeld)', 'WZ1.bv.10.bouw.zzp_inhuur-inlenen-leaseauto-bestel-tijdelijk-b2b'],
    ['Lunchroom (voorbeeld)', 'WZ1.vof.1.horeca.alcohol-jong-nuluren-minloon-b2c-togo-partner'],
    ['Webwinkel (voorbeeld)', 'WZ1.bv.1.handel.b2c-online-producten-import-verpakking-claims-elektronica'],
    ['Zzp-adviseur (voorbeeld)', 'WZ1.ez.0.zakelijk.opdracht-b2b-starter'],
    ['Uitzendbureau (voorbeeld)', 'WZ1.bv.50.zakelijk.uitlenen-migrant-huisvesting-minloon-b2b-leaseauto'],
    ['Kwekerij (voorbeeld)', 'WZ1.vof.1.agro.bloemen-b2b-bestel-zon-partner-jong'],
    ['Kinderopvang (voorbeeld)', 'WZ1.bv.10.kinderopvang.kdv-tijdelijk-stage-b2c'],
    ['Transportbedrijf (voorbeeld)', 'WZ1.bv.10.vervoer.vracht-bestel_int-leaseauto-inlenen-b2b-tijdelijk'],
  ];
  function loadDemo() {
    const have = new Set(S.clients.map((c) => c.name));
    let added = 0;
    for (const [name, code] of DEMO) {
      if (have.has(name)) continue;
      if (limit() && S.clients.length >= limit()) break;
      S.clients.push({ id: uid(), name, contact: '', profile: WZ.decode(code) }); added++;
    }
    save(); toast(added ? `${added} voorbeeldklanten toegevoegd.` : 'De voorbeeldklanten staan er al in.');
  }

  /* ---------- client dialog ---------- */
  const dlg = $('#dlg');
  let editing = null, formApi = null, draft = WZ.emptyProfile();
  function openDialog(id) {
    editing = id ? S.clients.find((c) => c.id === id) : null;
    if (!editing && limit() && S.clients.length >= limit()) return toast(LIC.state === 'ok' ? `Je licentie geldt voor ${limit()} klanten.` : `Zonder geldige licentie kun je ${limit()} klanten bijhouden.`);
    draft = editing ? WZ.cleanProfile(editing.profile) : WZ.emptyProfile();
    $('#dlg-title').textContent = editing ? 'Profiel bewerken' : 'Nieuwe klant';
    $('#c-name').value = editing ? editing.name : '';
    $('#c-contact').value = editing ? editing.contact : '';
    $('#c-code').value = ''; $('#dlg-error').textContent = '';
    $('#c-code-note').textContent = 'De antwoorden hieronder worden dan ingevuld.';
    const host = $('#c-form'); const clone = host.cloneNode(false); host.replaceWith(clone);   // drop old listeners
    formApi = WZ.form(clone, draft, (p) => { draft = p; }, { id: 'dlg', subject: 'deze klant' });
    dlg.showModal(); $('#c-name').focus();
  }
  $('#c-apply').addEventListener('click', () => {
    const p = WZ.decode($('#c-code').value);
    if (!p) { $('#c-code-note').textContent = 'Deze code herken ik niet. Een code begint met WZ1.'; return; }
    draft = p; formApi.set(p); $('#c-code-note').textContent = 'Overgenomen: ' + WZ.profileLabel(p) + '.';
  });
  $('#dlg-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('#c-name').value.trim();
    if (!name) { $('#dlg-error').textContent = 'Vul een naam in.'; return; }
    if (!WZ.isComplete(draft)) { $('#dlg-error').textContent = 'Kies een rechtsvorm en het aantal werknemers.'; return; }
    if (S.clients.some((c) => c.name.toLowerCase() === name.toLowerCase() && (!editing || c.id !== editing.id))) { $('#dlg-error').textContent = 'Er staat al een klant met deze naam in.'; return; }
    const contact = $('#c-contact').value.trim();
    if (editing) Object.assign(editing, { name, contact, profile: WZ.cleanProfile(draft) });
    else { const c = { id: uid(), name, contact, profile: WZ.cleanProfile(draft) }; S.clients.push(c); ui.client = c.id; ui.tab = 'klanten'; }
    save(); dlg.close(); render(); toast('Opgeslagen.');
  });
  $('#dlg-close').addEventListener('click', () => dlg.close());
  $('#dlg-cancel').addEventListener('click', () => dlg.close());

  /* ---------- exports ---------- */
  function csv() {
    if (!S.clients.length) return toast('Er zijn nog geen klanten.');
    // A leading = + - or @ would make Excel read a cell as a formula: neutralise it.
    const q = (v) => '"' + String(v == null ? '' : v).replace(/^([=+\-@\t\r])/, "'$1").replace(/"/g, '""') + '"';
    const lines = [['Klant', 'Wijziging', 'Ingangsdatum', 'Status', 'Soort', 'Geldt', 'Reden', 'Bron'].map(q).join(';')];
    for (const c of [...S.clients].sort((a, b) => a.name.localeCompare(b.name, 'nl'))) {
      for (const r of [...M.get(c.id).values()].filter((x) => x.cls === 'raakt' || x.cls === 'mogelijk').sort(WZ.sortItems)) {
        lines.push([c.name, r.item.t, r.item.d || r.item.dn, WZ.PHASE[r.item.ph].n, WZ.KIND[r.kind], r.cls === 'raakt' ? 'ja' : 'mogelijk', WZ.reason(r, 'k'), r.item.url].map(q).join(';'));
      }
    }
    WZ.download('wetzicht-portefeuille-' + WZ.todayIso() + '.csv', '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
    toast('Csv-bestand opgeslagen.');
  }
  function backup() {
    WZ.download('wetzicht-backup-' + WZ.todayIso() + '.json', JSON.stringify({ app: 'wetzicht-kantoor', version: 1, saved: new Date().toISOString(), firm: S.firm, form: S.form, license: S.license || '', clients: S.clients }, null, 2), 'application/json');
    toast('Back-up opgeslagen.');
  }
  $('#restore-file').addEventListener('change', async (e) => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (data.app !== 'wetzicht-kantoor' || !Array.isArray(data.clients)) throw new Error('format');
      const clients = data.clients.map(cleanClient).filter(Boolean);
      if (S.clients.length && !confirm(`Deze back-up bevat ${clients.length} klanten en vervangt de ${S.clients.length} klanten die er nu in staan. Doorgaan?`)) return;
      // A back-up carries its licence. If that code is still valid it counts here too, so a move to a new computer keeps every client.
      const lic = data.license ? await readLicense(data.license) : null;
      const keepLic = lic && lic.state !== 'bad' && !(LIC.state === 'ok' && lic.state === 'expired');
      const lim = keepLic ? (lic.state === 'ok' ? lic.max : (CFG.freeClients || 0)) : limit();
      const dropped = lim && clients.length > lim ? clients.length - lim : 0;
      if (dropped && !confirm(`Zonder geldige licentie kun je ${lim} klanten bijhouden. Van de ${clients.length} klanten in deze back-up worden de laatste ${dropped} niet teruggezet. Het back-upbestand zelf blijft compleet. Doorgaan?`)) return;
      S.clients = dropped ? clients.slice(0, lim) : clients;
      S.firm = String(data.firm || '').replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 60); S.form = data.form === 'je' ? 'je' : 'u';
      if (keepLic) { S.license = lic.code; LIC = lic; }
      ui.client = null;
      save(); render(); toast(dropped ? `${S.clients.length} klanten teruggezet, ${dropped} niet.` : `${S.clients.length} klanten teruggezet.`);
    } catch (err) { toast('Dit is geen back-up van Wetzicht.'); }
  });

  /* ---------- events ---------- */
  $$('.tab').forEach((b) => b.addEventListener('click', () => go(b.dataset.tab)));
  document.addEventListener('click', async (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (el.tagName === 'INPUT') return;          // checkboxes are handled on change
    if (act === 'open' && e.target.closest('button, a')) return;
    switch (act) {
      case 'demo': loadDemo(); ui.tab = 'portefeuille'; render(); break;
      case 'new': openDialog(null); break;
      case 'edit': openDialog(id); break;
      case 'client': e.stopPropagation(); go('klanten', { client: id }); break;
      case 'back': go('klanten'); break;
      case 'del': {
        const c = S.clients.find((x) => x.id === id);
        if (c && confirm(`${c.name} verwijderen uit je portefeuille?`)) { S.clients = S.clients.filter((x) => x.id !== id); save(); go('klanten'); toast('Verwijderd.'); }
        break;
      }
      case 'filter': ui.filter = el.dataset.v; ui.open = null; render(); break;
      case 'open': ui.open = ui.open === id ? null : id; render(); break;
      case 'copy-names': toast((await WZ.copy(hitsOf(id, 'raakt').map((c) => c.name).join('\n'))) ? 'Namen gekopieerd.' : 'Kopiëren lukte niet.'); break;
      case 'copy-intake': toast((await WZ.copy(intakeLink())) ? 'Link gekopieerd.' : 'Kopiëren lukte niet.'); break;
      case 'copy-letter': toast((await WZ.copy($('#letter').value)) ? 'Brief gekopieerd.' : 'Kopiëren lukte niet. Selecteer de tekst met de hand.'); break;
      case 'print-letter': { const p = $('#printable'); p.textContent = $('#letter').value; p.hidden = false; window.print(); p.hidden = true; break; }
      case 'csv': csv(); break;
      case 'backup': backup(); break;
      case 'restore': $('#restore-file').click(); break;
      case 'wipe': if (confirm('Alle klanten en instellingen in deze browser wissen? Dit kan niet ongedaan worden gemaakt.' + (S.license ? ' Je licentie blijft staan.' : ''))) { const keep = S.license; S = fresh(); S.license = keep; markSeen(); go('portefeuille'); toast('Alles gewist.'); } break;
      case 'go-license': go('instellingen'); { const card = $('#licentie'); if (card) card.scrollIntoView({ block: 'center' }); const box = $('#lic-code'); if (box) box.focus({ preventScroll: true }); } break;
      case 'lic-activate': {
        const err = $('#lic-error'), raw = $('#lic-code').value;
        if (!raw.trim()) { err.textContent = 'Plak eerst je licentiecode in het vak.'; break; }
        const r = await readLicense(raw);
        if (r.state === 'bad') { err.textContent = LIC_ERR[r.why]; break; }
        if (r.state === 'expired') { err.textContent = `Deze code is op ${WZ.fmtDate(r.until)} verlopen.`; break; }
        S.license = r.code; LIC = r; save(); render(); toast(`Licentie geactiveerd voor ${r.name}.`);
        break;
      }
      case 'lic-remove': if (confirm('De licentie uit deze browser verwijderen? Je klanten blijven staan. Bewaar de code als je hem later weer wilt gebruiken.')) { S.license = ''; LIC = { state: 'none' }; save(); render(); toast('Licentie verwijderd.'); } break;
      case 'seen': markSeen(); render(); toast('Gemarkeerd als gezien.'); break;
      case 'example-on': ui.example = true; render(); break;
      case 'example-off': ui.example = false; render(); break;
    }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.act === 'maybe') { ui.maybe = t.checked; render(); }
    else if (t.dataset.act === 'letter-opt') { ui.letter[t.dataset.k] = t.checked; const c = S.clients.find((x) => x.id === ui.client); if (c) $('#letter').value = letter(c); }
    else if (t.id === 's-firm') { S.firm = t.value.replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 60); t.value = S.firm; save(); toast('Opgeslagen.'); }
    else if (t.name === 's-form') { S.form = t.value === 'je' ? 'je' : 'u'; save(); toast('Opgeslagen.'); }
  });

  // Redraw the portfolio when the window crosses the width where the raster fits.
  let wasNarrow = window.innerWidth < 720;
  window.addEventListener('resize', () => {
    const now = window.innerWidth < 720;
    if (now !== wasNarrow) { wasNarrow = now; if (ui.tab === 'portefeuille' && !dlg.open) render(); }
  });

  load();
  render();
  // The licence check is asynchronous: draw first as a trial, then again once the stored code has been checked.
  const ready = restoreLicense().then(licenseFromLink);
  window.__kantoor = { get S() { return S; }, get LIC() { return LIC; }, ui, render, signals, letter, markSeen, readLicense, restoreLicense, limit, ready };
})();
</script>
</body>
</html>
